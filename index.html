<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinCat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js"></script>
  </head>
  <body>
    <!-- Nav - Start -->
    <nav
      class="navbar navbar-expand-lg navbar-dark fixed-top"
    >
      <div class="container">
        <a class="navbar-brand d-flex gap-2 fs-2 me-5 fw-bold" href="#"
          ><img class="logo"
            src="./images/logo.svg"
            alt="TinCat Logo"
            style="width: calc(1.325rem + .9vw)"
          />TinCat</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
          aria-controls="navbarMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse fs-5" id="navbarMenu">
          <ul class="navbar-nav gap-3 me-auto">
            <li class="nav-item">
              <a class="nav-link text-end active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item"><a class="nav-link text-end" href="#">Features</a></li>
            <li class="nav-item"><a class="nav-link text-end" href="#">Pricing</a></li>
            <li class="nav-item"><a class="nav-link text-end" href="#">Safety</a></li>
            <li class="nav-item"><a class="nav-link text-end" href="#">Support</a></li>
            <li class="nav-item"><a class="nav-link text-end" href="#">Download</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Nav - End -->

    <!-- Header - Start -->
    <header data-bs-theme="dark">
      <div class="container overflow-y-hidden header-container">
        <div class="row vh-100">
          <div class="col-12 col-md-6 align-self-center">
            <h1 class="display-2 fw-bold text-light mb-3">
              TinCat <br />
              <span class="display-5 fw-medium fst-italic text-light-emphasis"
                >Find your cat's perfect match</span
              >
            </h1>
            <p class="fs-2 fw-light text-light mb-5">
              Meet adorable cats around you
            </p>
            <div class="row">
              <div class="col-12 d-flex gap-3 justify-content-center">
                <button class="btn btn-light btn-lg d-flex gap-2">
                  <img src="./images/download/ios.svg" alt="" />Download
                </button>
                <button class="btn btn-outline-light btn-lg d-flex gap-2">
                  <img src="./images/download/android.svg" alt="" />Download
                </button>
              </div>
            </div>
          </div>
          <div
            class="col-6 d-none d-md-flex justify-content-center align-self-end"
          >
            <div class="phone">
              <div class="screens">
                <img
                  class="phoneScreenClose"
                  src="./images/phone/screen_close.svg"
                  alt=""
                />
                <img
                  class="phoneScreenOpen"
                  src="./images/phone/screen_open.svg"
                  alt=""
                />
              </div>
              <img class="phoneCover" src="./images/phone/iphone.svg" alt="" />
              <button class="closeButton" aria-label="Turn phone on/off">
                <img src="./images/phone/closeButton.svg" alt="" />
                <span class="pulse"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- Header - End -->

    <!-- Feature - Start -->
    <section class="bg-light min-vh-100">

    </section>
    <!-- Feature - End -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
